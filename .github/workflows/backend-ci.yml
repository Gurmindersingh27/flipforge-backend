name: Backend CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  inspection-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flipforge_inspection_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flipforge_inspection_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Inspection contracts and concurrent writes on PostgreSQL
        run: python -m unittest discover -s tests -p 'test_item_inspections_postgres.py' -v
        env:
          ITEM_INSPECTION_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/flipforge_inspection_test
